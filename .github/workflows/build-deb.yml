name: Build DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build application
        run: |
          pyinstaller FakeNewsDetector.spec

      - name: Create DEB structure
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/opt/FakeNewsDetector

          cp -r dist/FakeNewsDetector/* \
            package/opt/FakeNewsDetector/

      - name: Create control file
        run: |
          cat > package/DEBIAN/control <<'EOF'
          Package: fakenewsdetector
          Version: 1.0.0
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: SPremakumar
          Description: Fake News Detector
           Application for detecting fake news.
          EOF

      - name: Create launcher
        run: |
          cat > package/usr-bin-fakenewsdetector <<'EOF'
          #!/bin/sh
          exec /opt/FakeNewsDetector/FakeNewsDetector "$@"
          EOF

          mkdir -p package/usr/bin
          mv package/usr-bin-fakenewsdetector \
             package/usr/bin/fakenewsdetector
          chmod +x package/usr/bin/fakenewsdetector

      - name: Build DEB
        run: |
          dpkg-deb --build package FakeNewsDetector-Linux-v1.0.0.deb

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: FakeNewsDetector-Linux
          path: FakeNewsDetector-Linux-v1.0.0.deb